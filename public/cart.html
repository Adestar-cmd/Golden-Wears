<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart | Golden Wears</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="cart.css" />
    <link rel="shortcut icon" href="images/favicon-32x32.png" type="image/x-icon">
  </head>
  <body>
    <nav class="gw-navbar cart-navbar">
      <div class="container-fluid">
        <a class="navbar-brand gw-brand" href="index.html">
          Golden Wears<span>.</span>
        </a>

        <a href="index.html" class="continue-link">
          <i class="bi bi-arrow-left"></i>
          Continue Shopping
        </a>
      </div>
    </nav>

    <main class="container cart-page">
      <div class="cart-heading">
        <p class="cart-label">YOUR SELECTION</p>
        <h1>Shopping Cart</h1>
        <p>Review your items before proceeding.</p>
      </div>

      <div class="row g-4">
        <div class="col-lg-8">
          <div id="cartItems"></div>
        </div>

        <div class="col-lg-4">
          <div class="cart-summary">
            <h2>Order Summary</h2>

            <div class="summary-line">
              <span>Subtotal</span>
              <span>₦<span id="cartSubtotal">0</span></span>
            </div>

            <p class="delivery-note">
              Delivery fees will be calculated at checkout.
            </p>

            <a href="checkout.html" class="checkout-button" id="checkoutButton">
              Proceed to Checkout
              <i class="bi bi-arrow-right"></i>
            </a>

            <a href="index.html" class="back-to-shop"> Continue Shopping </a>
          </div>
        </div>
      </div>
    </main>

    <footer class="cart-footer">
      <a href="index.html">Golden Wears</a>
      <p>Style made simple.</p>
    </footer>

    <script src="cart.js"></script>
  </body>
</html>
