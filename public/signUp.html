<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | Golden Wears</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="signUp.css" />
    <link rel="shortcut icon" href="images/favicon-32x32.png" type="image/x-icon">
  </head>
  <body>
    <main class="signup-page">
      <a href="index.html" class="back-to-store">
        &larr; Back to Golden Wears
      </a>

      <section class="image-section">
        <img
          src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=1000&q=85"
          alt="Fashion model in an editorial photoshoot"
          class="fashion-image"
        />
        <div class="image-caption">
          <p>GOLDEN WEARS</p>
          <h2>Find your style.<br />Make it yours.</h2>
        </div>
      </section>

      <section class="form-section">
        <div class="signup-content">
          <p class="signup-brand">GOLDEN WEARS</p>

          <h1>Create your<br />account</h1>

          <p class="signup-description">
            Join Golden Wears and discover your next favourite look.
          </p>

          <form id="signupForm">
            <div
              id="formMessage"
              class="form-message d-none text-center alert rounded-3"
              role="status"
              aria-live="polite"
            ></div>
            <div class="input-group-custom">
              <input
                type="text"
                id="fullname"
                name="fullname"
                placeholder="Full name"
                aria-label="Full name"
                autocomplete="name"
                required
              />
            </div>

            <div class="input-group-custom">
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Email address"
                aria-label="Email address"
                autocomplete="email"
                required
              />
            </div>

            <div class="input-group-custom password-field">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                aria-label="Create a password"
                autocomplete="new-password"
                required
                minlength="6"
              />
              <button
                type="button"
                class="password-toggle"
                id="passwordToggle"
                aria-label="Show password"
                aria-pressed="false"
              >
                <i
                  class="bi bi-eye-slash"
                  id="passwordIcon"
                  aria-hidden="true"
                ></i>
              </button>
            </div>

            <div class="divider">
              <span></span>
              <p>or</p>
              <span></span>
            </div>

            <button type="button" class="social-button" id="googleSignInBtn">
              <span class="google-logo">G</span>
              <span>Continue with Google</span>
            </button>

            <button type="button" class="social-button" id="appleSignInBtn">
              <i class="bi bi-apple apple-logo"></i>
              <span>Continue with Apple</span>
            </button>

            <button type="submit" class="create-account" id="createAccountBtn">
              Create account
            </button>
          </form>

          <p class="signin-link">
            Already have an account?
            <a href="signIn.html">Sign in</a>
          </p>
        </div>
      </section>
    </main>

    
<script type="module">
    
    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

    import {
        getAuth,
        createUserWithEmailAndPassword,
        updateProfile,
        GoogleAuthProvider,
        signInWithPopup,
        OAuthProvider
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";


    
    const firebaseConfig = {
        apiKey: "AIzaSyDtqlrAV5VDk98_9iHlEpbBozdyZNKAgGw",
        authDomain: "golden-wears.firebaseapp.com",
        projectId: "golden-wears",
        storageBucket: "golden-wears.firebasestorage.app",
        messagingSenderId: "215953923432",
        appId: "1:215953923432:web:f8c93daa03d551cd950add",
        measurementId: "G-K8GRJF2ZJR"
    };


    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    
    const signupForm = document.getElementById("signupForm");
    const fullname = document.getElementById("fullname");
    const email = document.getElementById("email");
    const password = document.getElementById("password");

    const formMessage = document.getElementById("formMessage");
    const createAccountBtn = document.getElementById("createAccountBtn");

    const passwordToggle = document.getElementById("passwordToggle");
    const passwordIcon = document.getElementById("passwordIcon");

    const googleSignInBtn = document.getElementById("googleSignInBtn");
    const appleSignInBtn = document.getElementById("appleSignInBtn");


    
    let messageTimer;

    function showFormMessage(message, type) {
        clearTimeout(messageTimer);

        formMessage.textContent = message;

        formMessage.className =
            "form-message text-center alert rounded-3 alert-" + type;

        formMessage.classList.remove("d-none");

        messageTimer = setTimeout(function () {
            formMessage.classList.add("d-none");
            formMessage.textContent = "";
        }, 4000);
    }


    
    function goToDashboard() {
        window.location.replace("dashboard.html");
    }


    
    signupForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const fullnameValue = fullname.value.trim();
        const emailValue = email.value.trim();
        const passwordValue = password.value;

        if (
            fullnameValue === "" ||
            emailValue === "" ||
            passwordValue === ""
        ) {
            showFormMessage(
                "Please complete all fields.",
                "danger"
            );

            return;
        }

        createAccountBtn.disabled = true;
        createAccountBtn.textContent = "Creating Account...";

        createUserWithEmailAndPassword(
            auth,
            emailValue,
            passwordValue
        )
            .then(function (userCredential) {
                return updateProfile(userCredential.user, {
                    displayName: fullnameValue
                });
            })
            .then(function () {
                showFormMessage(
                    "Account created successfully! Redirecting...",
                    "success"
                );

                goToDashboard();
            })
            .catch(function (error) {
                console.log(error.code, error.message);

                showFormMessage(
                    "Unable to create account. " + error.message,
                    "danger"
                );
            })
            .finally(function () {
                createAccountBtn.disabled = false;
                createAccountBtn.textContent = "Create Account";
            });
    });



    const googleProvider = new GoogleAuthProvider();

    googleSignInBtn.addEventListener("click", function () {
        googleSignInBtn.disabled = true;

        signInWithPopup(auth, googleProvider)
            .then(function (result) {
                console.log(
                    "Google sign-in successful:",
                    result.user
                );

                goToDashboard();
            })
            .catch(function (error) {
                console.log(error.code, error.message);

                showFormMessage(
                    "Google sign-in failed. Please try again.",
                    "danger"
                );
            })
            .finally(function () {
                googleSignInBtn.disabled = false;
            });
    });


   
    const appleProvider = new OAuthProvider("apple.com");

    appleSignInBtn.addEventListener("click", function () {
        appleSignInBtn.disabled = true;

        signInWithPopup(auth, appleProvider)
            .then(function (result) {
                console.log(
                    "Apple sign-in successful:",
                    result.user
                );

                goToDashboard();
            })
            .catch(function (error) {
                console.log(error.code, error.message);

                showFormMessage(
                    "Apple sign-in failed. Please try again.",
                    "danger"
                );
            })
            .finally(function () {
                appleSignInBtn.disabled = false;
            });
    });


    
    passwordToggle.addEventListener("click", function () {
        if (password.type === "password") {
            password.type = "text";

            passwordIcon.className = "bi bi-eye";

            passwordToggle.setAttribute(
                "aria-label",
                "Hide password"
            );

            passwordToggle.setAttribute(
                "aria-pressed",
                "true"
            );

        } else {
            password.type = "password";

            passwordIcon.className = "bi bi-eye-slash";

            passwordToggle.setAttribute(
                "aria-label",
                "Show password"
            );

            passwordToggle.setAttribute(
                "aria-pressed",
                "false"
            );
        }
    });

</script>


    <script type="module" src="signup.js"></script>
  </body>
</html>
